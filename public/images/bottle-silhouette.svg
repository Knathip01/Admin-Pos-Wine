<svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Dark glass gradient -->
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020617" />
      <stop offset="50%" style="stop-color:#1e293b" />
      <stop offset="100%" style="stop-color:#020617" />
    </linearGradient>
    
    <!-- Circular clip for the logo -->
    <clipPath id="logoCircle">
      <circle cx="50" cy="115" r="18" />
    </clipPath>
  </defs>

  <!-- Wine Bottle Shape -->
  <path d="
    M 42,10 
    L 42,8 
    Q 42,6 44,6 
    L 56,6 
    Q 58,6 58,8 
    L 58,10 
    L 58,55 
    C 58,80 75,85 75,105 
    L 75,190 
    Q 75,196 65,196 
    L 35,196 
    Q 25,196 25,190 
    L 25,105 
    C 25,85 42,80 42,55 
    Z" 
    fill="url(#bottleGrad)"
  />

  <!-- Red Wine Foil/Capsule -->
  <path d="M 42,10 L 58,10 L 58,25 Q 58,28 50,28 Q 42,28 42,25 Z" fill="#7f1d1d" />

  <!-- Logo text -->
  <!-- White background for logo circle -->
  <circle cx="50" cy="115" r="18" fill="white" />
  
  <text 
    x="50" 
    y="115" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="Arial, sans-serif" 
    font-size="4" 
    font-weight="900" 
    fill="#020617"
  >Thebottleclub</text>
  
  <!-- Subtle gold border for the logo -->
  <circle cx="50" cy="115" r="18.5" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.9" />

  <!-- Highlights for glass effect -->
  <path d="M 32,105 L 32,185" stroke="white" stroke-width="1.5" stroke-opacity="0.1" stroke-linecap="round" />
  <path d="M 45,15 L 45,50" stroke="white" stroke-width="0.8" stroke-opacity="0.1" stroke-linecap="round" />
</svg>
